services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque
    ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica as migrações e sai. O estoque só sobe depois que este passo termina
  # com sucesso, então o serviço nunca encontra um esquema pela metade.
  migrate:
    image: migrate/migrate:v4.17.1
    volumes: ["./migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://estoque:estoque@postgres:5432/estoque?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # `Ex` habilita a notificação de chave expirada, que dispara a liberação
    # pronta da reserva. A varredura no banco continua sendo a autoridade.
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["55672:5672", "15673:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12

  estoque:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://estoque:estoque@postgres:5432/estoque?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_ADDR: ":50051"
      ADMIN_ADDR: ":8090"
      TLS_CERT_FILE: /certs/servidor.pem
      TLS_KEY_FILE: /certs/servidor-key.pem
      TLS_CLIENT_CA_FILE: /certs/ca.pem
      TLS_CLIENT_AUTH: require
      RESERVA_TTL: 10m
      POLTRONAS_MAX_POR_BLOQUEIO: "10"
      VARREDURA_EXPIRACAO_INTERVALO: 10s
      AMQP_PREFETCH: "32"
      LOG_LEVEL: info
    volumes: ["./certs:/certs:ro"]
    ports: ["50051:50051", "8090:8090"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
