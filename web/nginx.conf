# Tudo sai da mesma origem de propósito: nenhum dos serviços Go responde CORS,
# e um navegador chamando `localhost:8082` direto pararia no preflight do
# header `Authorization`. Aqui o preflight nem acontece.
server {
    listen 80;
    server_name _;

    # Os nomes dos serviços são resolvidos a cada requisição, e não uma vez na
    # largada: assim o nginx sobe mesmo que algum parceiro ainda não exista, e
    # um container recriado com outro IP continua sendo alcançado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/catalogo/ {
        set $alvo_catalogo catalogo;
        proxy_pass http://$alvo_catalogo:8080/api/v1/;
        include /etc/nginx/conf.d/repasse.inc;
    }

    location /api/estoque/ {
        set $alvo_estoque estoque;
        proxy_pass http://$alvo_estoque:8085/api/v1/;
        include /etc/nginx/conf.d/repasse.inc;
    }

    location /api/pagamento/ {
        set $alvo_pagamento pagamento;
        proxy_pass http://$alvo_pagamento:8080/api/v1/;
        include /etc/nginx/conf.d/repasse.inc;
    }

    location /api/notificacao/ {
        set $alvo_notificacao notificacao;
        proxy_pass http://$alvo_notificacao:8080/api/v1/;
        include /etc/nginx/conf.d/repasse.inc;
    }

    # O emissor dos tokens é `http://keycloak:8081/realms/cinema`, endereço que
    # o navegador do host não resolve. Repassar por aqui mantém o emissor
    # intacto — é ele que os quatro serviços validam —, sem exigir que o
    # navegador chegue ao Keycloak por conta própria.
    location /auth/ {
        set $alvo_keycloak keycloak;
        proxy_pass http://$alvo_keycloak:8081/;
        include /etc/nginx/conf.d/repasse.inc;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
