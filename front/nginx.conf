server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mesmos proxies do vite.config.ts, apontando para os serviços da rede do compose.
  location /catalogo/ {
    proxy_pass http://catalogo:8080/;
    proxy_set_header Host $host;
  }
  location /estoque/ {
    proxy_pass http://estoque:8080/;
    proxy_set_header Host $host;
  }
  location /otlp/ {
    proxy_pass http://jaeger:4318/;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri /index.html;
  }
}
