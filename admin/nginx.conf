server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mesmos proxies do vite.config.ts, apontando para os serviços da rede do compose.
  location /catalogo/ {
    proxy_pass http://catalogo:8080/;
    proxy_set_header Host $host;
  }
  location /identidade/ {
    proxy_pass http://keycloak:8081/;
    proxy_set_header Host keycloak:8081;
  }
  location / {
    try_files $uri /index.html;
  }
}
