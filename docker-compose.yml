services:  
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["${PORTA_POSTGRES:-5434}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine    
    command: ["redis-server", "--notify-keyspace-events", "Ex", "--appendonly", "yes"]
    volumes:
      - redis-dados:/data
    ports: ["${PORTA_REDIS:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    ports:
      - "${PORTA_RABBITMQ:-5672}:5672"
      - "${PORTA_RABBITMQ_PAINEL:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8081"      
      KC_HOSTNAME: http://keycloak:8081
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-dados:/opt/keycloak/data
      - ./catalogo/keycloak:/opt/keycloak/data/import:ro
    ports: ["${PORTA_KEYCLOAK:-8081}:8081"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /realms/cinema HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | head -1 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 30
  
  # Observabilidade: os serviços enviam spans (OTLP/HTTP) ao Jaeger e expõem
  # /metrics, que o Prometheus raspa pela rede interna.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${PORTA_JAEGER:-16686}:16686"
      # OTLP/HTTP: o frontend (proxy do Vite em /otlp) envia os spans do navegador aqui.
      - "${PORTA_JAEGER_OTLP:-4318}:4318"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["${PORTA_PROMETHEUS:-9092}:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Ambiente de desenvolvimento: acesso anônimo como administrador, sem login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${PORTA_GRAFANA:-3000}:3000"]
    depends_on: [prometheus, jaeger]

  migrate-catalogo:
    image: migrate/migrate:v4.17.1
    volumes: ["./catalogo/migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://catalogo:catalogo@postgres:5432/cinema?sslmode=disable&search_path=catalogo
      - up
    depends_on:
      postgres:
        condition: service_healthy

  migrate-estoque:
    image: migrate/migrate:v4.17.1
    volumes: ["./estoque/migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://estoque:estoque@postgres:5432/cinema?sslmode=disable&search_path=estoque
      - up
    depends_on:
      postgres:
        condition: service_healthy

  migrate-notificacao:
    image: migrate/migrate:v4.17.1
    volumes: ["./notificacao/migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://notificacao:notificacao@postgres:5432/cinema?sslmode=disable&search_path=notificacao
      - up
    depends_on:
      postgres:
        condition: service_healthy

  migrate-pagamento:
    image: migrate/migrate:v4.17.1
    volumes: ["./pagamento/migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://pagamento:pagamento@postgres:5432/cinema?sslmode=disable&search_path=pagamento
      - up
    depends_on:
      postgres:
        condition: service_healthy
  
  catalogo:
    build:
      context: ./catalogo
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OBS_ADDR: ":9090"
      DATABASE_URL: postgres://catalogo:catalogo@postgres:5432/cinema?sslmode=disable
      KEYCLOAK_ISSUER_URL: http://keycloak:8081/realms/cinema
      KEYCLOAK_AUDIENCE: cinema-app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # gRPC serviço a serviço: o estoque consulta preço e status da sessão aqui.
      GRPC_ADDR: ":9091"
    ports:
      - "${PORTA_CATALOGO:-8082}:8080"
      - "${PORTA_CATALOGO_GRPC:-9091}:9091"
    depends_on:
      jaeger:
        condition: service_started
      migrate-catalogo:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      # O catálogo anuncia a sessão criada. A caixa de saída o deixa subir e
      # atender sem o broker, mas ele o exige na largada como qualquer outra
      # configuração obrigatória.
      rabbitmq:
        condition: service_healthy

  estoque:
    build:
      context: ./estoque
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OBS_ADDR: ":9090"
      DATABASE_URL: postgres://estoque:estoque@postgres:5432/cinema?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ADMIN_ADDR: ":8090"
      HTTP_ADDR: ":8085"
      JWKS_URL: http://keycloak:8081/realms/cinema/protocol/openid-connect/certs
      JWT_ISSUER: http://keycloak:8081/realms/cinema
      JWT_AUDIENCE: cinema-app
      # A reserva consulta preço e status da sessão no catálogo por gRPC.
      CATALOGO_GRPC_ADDR: catalogo:9091
      CATALOGO_TIMEOUT: 2s
      RESERVA_TTL: 10m
      POLTRONAS_MAX_POR_BLOQUEIO: "10"
      VARREDURA_EXPIRACAO_INTERVALO: 10s
      AMQP_PREFETCH: "32"
    ports:
      - "${PORTA_ESTOQUE_ADMIN:-8090}:8090"
      - "${PORTA_ESTOQUE_REST:-8085}:8085"
    depends_on:
      jaeger:
        condition: service_started
      migrate-estoque:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Sem healthcheck de propósito: o catálogo só é consultado quando chega
      # uma reserva, não na largada, então subir junto basta.
      catalogo:
        condition: service_started

  pagamento:
    build:
      context: ./pagamento
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OBS_ADDR: ":9090"
      DATABASE_URL: postgres://pagamento:pagamento@postgres:5432/cinema?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWKS_URL: http://keycloak:8081/realms/cinema/protocol/openid-connect/certs
      JWT_ISSUER: http://keycloak:8081/realms/cinema
      JWT_AUDIENCE: cinema-app
    ports: ["${PORTA_PAGAMENTO:-8083}:8080"]
    depends_on:
      jaeger:
        condition: service_started
      migrate-pagamento:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  notificacao:
    build:
      context: ./notificacao
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OBS_ADDR: ":9090"
      DATABASE_URL: postgres://notificacao:notificacao@postgres:5432/cinema?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWKS_URL: http://keycloak:8081/realms/cinema/protocol/openid-connect/certs
      JWT_ISSUER: http://keycloak:8081/realms/cinema
      JWT_AUDIENCE: cinema-app      
      INGRESSO_QR_SEGREDO: ${INGRESSO_QR_SEGREDO:-segredo-de-desenvolvimento-nao-usar-em-producao}
      PORTARIA_API_KEY: ${PORTARIA_API_KEY:-chave-de-portaria-de-teste}
      NOTIFICADOR_MODO: enviar
    ports: ["${PORTA_NOTIFICACAO:-8084}:8080"]
    depends_on:
      jaeger:
        condition: service_started
      migrate-notificacao:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  front:
    build:
      context: ./front
    restart: on-failure
    ports: ["${PORTA_FRONT:-5173}:80"]
    depends_on: [catalogo, estoque, jaeger]

  admin:
    build:
      context: ./admin
    restart: on-failure
    ports: ["${PORTA_ADMIN:-5174}:80"]
    depends_on: [catalogo, keycloak]

volumes:
  postgres-dados:
  redis-dados:
  rabbitmq-dados:
  keycloak-dados: