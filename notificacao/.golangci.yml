version: "2"
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - rowserrcheck
    - depguard
  settings:
    depguard:
      rules:
        # O núcleo (domínio e casos de uso) não conhece adaptadores nem
        # infraestrutura: persistência, mensageria e transporte são detalhe de borda.
        nucleo-sem-adaptadores:
          files:
            - "**/internal/domain/**"
            - "**/internal/usecase/**"
          deny:
            - pkg: "github.com/oseias/ingressos-golang/notificacao/internal/adapter"
              desc: "domain/usecase não podem importar adaptadores"
            - pkg: "github.com/oseias/ingressos-golang/notificacao/internal/platform"
              desc: "domain/usecase não podem importar infraestrutura de plataforma"
            - pkg: "gorm.io"
              desc: "biblioteca de persistência é detalhe de adaptador"
            - pkg: "github.com/jackc/pgx"
              desc: "driver de banco é detalhe de adaptador"
            - pkg: "github.com/rabbitmq/amqp091-go"
              desc: "o intermediário de mensagens é detalhe de adaptador"
            - pkg: "net/http"
              desc: "framework web é detalhe de adaptador"
            - pkg: "go.opentelemetry.io/otel"
              desc: "observabilidade é detalhe de adaptador"
formatters:
  enable:
    - gofmt
    - goimports
