services:  
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["${PORTA_POSTGRES:-5434}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine    
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports: ["${PORTA_REDIS:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${PORTA_RABBITMQ:-5672}:5672"
      - "${PORTA_RABBITMQ_PAINEL:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8081"      
      KC_HOSTNAME: http://keycloak:8081
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    volumes: ["./catalogo/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["${PORTA_KEYCLOAK:-8081}:8081"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /realms/cinema HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | head -1 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 30
  
  migrate-catalogo:
    image: migrate/migrate:v4.17.1
    volumes: ["./catalogo/migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://catalogo:catalogo@postgres:5432/cinema?sslmode=disable&search_path=catalogo
      - up
    depends_on:
      postgres:
        condition: service_healthy

  migrate-estoque:
    image: migrate/migrate:v4.17.1
    volumes: ["./estoque/migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://estoque:estoque@postgres:5432/cinema?sslmode=disable&search_path=estoque
      - up
    depends_on:
      postgres:
        condition: service_healthy

  migrate-notificacao:
    image: migrate/migrate:v4.17.1
    volumes: ["./notificacao/migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://notificacao:notificacao@postgres:5432/cinema?sslmode=disable&search_path=notificacao
      - up
    depends_on:
      postgres:
        condition: service_healthy

  migrate-pagamento:
    image: migrate/migrate:v4.17.1
    volumes: ["./pagamento/migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://pagamento:pagamento@postgres:5432/cinema?sslmode=disable&search_path=pagamento
      - up
    depends_on:
      postgres:
        condition: service_healthy
  
  # O catálogo fala gRPC em texto claro, enquanto o estoque real exige mTLS.
  # Até que o cliente do catálogo aprenda a apresentar certificado, ele continua
  # apontando para o dublê simulado. No host o simulado sai na porta 50052. 
  # A porta 50051 é do estoque real.
  estoque-simulado:
    build:
      context: ./catalogo
      dockerfile: Dockerfile.estoque-simulado
    ports: ["${PORTA_ESTOQUE_SIMULADO:-50052}:50051"]

  catalogo:
    build:
      context: ./catalogo
    environment:
      DATABASE_URL: postgres://catalogo:catalogo@postgres:5432/cinema?sslmode=disable
      KEYCLOAK_ISSUER_URL: http://keycloak:8081/realms/cinema
      KEYCLOAK_AUDIENCE: cinema-app
      ESTOQUE_GRPC_ADDR: estoque-simulado:50051
      LOG_LEVEL: info
    ports: ["${PORTA_CATALOGO:-8082}:8080"]
    depends_on:
      migrate-catalogo:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      estoque-simulado:
        condition: service_started

  estoque:
    build:
      context: ./estoque
    environment:
      DATABASE_URL: postgres://estoque:estoque@postgres:5432/cinema?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_ADDR: ":50051"
      ADMIN_ADDR: ":8090"
      HTTP_ADDR: ":8085"      
      JWKS_URL: http://keycloak:8081/realms/cinema/protocol/openid-connect/certs
      JWT_ISSUER: http://keycloak:8081/realms/cinema
      JWT_AUDIENCE: cinema-app
      TLS_CERT_FILE: /certs/servidor.pem
      TLS_KEY_FILE: /certs/servidor-key.pem
      TLS_CLIENT_CA_FILE: /certs/ca.pem
      TLS_CLIENT_AUTH: require
      RESERVA_TTL: 10m
      POLTRONAS_MAX_POR_BLOQUEIO: "10"
      VARREDURA_EXPIRACAO_INTERVALO: 10s
      AMQP_PREFETCH: "32"
      LOG_LEVEL: info
    volumes: ["./estoque/certs:/certs:ro"]
    ports:
      - "${PORTA_ESTOQUE_GRPC:-50051}:50051"
      - "${PORTA_ESTOQUE_ADMIN:-8090}:8090"
      - "${PORTA_ESTOQUE_REST:-8085}:8085"
    depends_on:
      migrate-estoque:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  pagamento:
    build:
      context: ./pagamento
    environment:
      DATABASE_URL: postgres://pagamento:pagamento@postgres:5432/cinema?sslmode=disable
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      JWKS_URL: http://keycloak:8081/realms/cinema/protocol/openid-connect/certs
      JWT_ISSUER: http://keycloak:8081/realms/cinema
      JWT_AUDIENCE: cinema-app
      NIVEL_LOG: info
    ports: ["${PORTA_PAGAMENTO:-8083}:8080"]
    depends_on:
      migrate-pagamento:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  notificacao:
    build:
      context: ./notificacao
    environment:
      DATABASE_URL: postgres://notificacao:notificacao@postgres:5432/cinema?sslmode=disable
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      JWKS_URL: http://keycloak:8081/realms/cinema/protocol/openid-connect/certs
      JWT_ISSUER: http://keycloak:8081/realms/cinema
      JWT_AUDIENCE: cinema-app      
      INGRESSO_QR_SEGREDO: ${INGRESSO_QR_SEGREDO:-segredo-de-desenvolvimento-nao-usar-em-producao}
      PORTARIA_API_KEY: ${PORTARIA_API_KEY:-chave-de-portaria-de-teste}
      NOTIFICADOR_MODO: enviar
      NIVEL_LOG: info
    ports: ["${PORTA_NOTIFICACAO:-8084}:8080"]
    depends_on:
      migrate-notificacao:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres-dados: