openapi: 3.1.0
info:
  title: Servico-Pagamento — API de consulta
  version: "1.0.0"
  description: |
    Única superfície síncrona do serviço. Serve para o aplicativo acompanhar o
    desfecho do pagamento de uma reserva enquanto o processamento acontece de
    forma assíncrona.

    Mudança incompatível exige versão nova no caminho (/api/v2).
servers:
  - url: /api/v1
paths:
  /pagamentos/reserva/{reserva_id}:
    get:
      summary: Consulta o andamento do pagamento de uma reserva
      description: |
        Devolve o estado atual da transação da reserva informada. Só a pessoa dona
        da reserva obtém dados: para qualquer outra, a resposta é indistinguível
        de reserva inexistente. Nenhum papel administrativo é reconhecido.
      operationId: consultarPagamentoPorReserva
      security:
        - clientCredentials: []
      parameters:
        - name: reserva_id
          in: path
          required: true
          description: UUID v4 da reserva
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transação encontrada e pertencente a quem consulta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagamento"
              examples:
                pago:
                  value:
                    transacao_id: e402a129-8812-4211-b123-000129381293
                    reserva_id: 9982a1b3-44c1-4221-a123-902183120192
                    status: PAGO
                    valor_total: 84.00
                    forma_pagamento: PIX
                    expira_em: "2026-08-29T21:45:00Z"
                    criado_em: "2026-08-29T21:35:00Z"
                processando:
                  value:
                    transacao_id: e402a129-8812-4211-b123-000129381293
                    reserva_id: 9982a1b3-44c1-4221-a123-902183120192
                    status: PROCESSANDO
                    valor_total: 84.00
                    forma_pagamento: CARTAO_CREDITO
                    expira_em: "2026-08-29T21:45:00Z"
                    criado_em: "2026-08-29T21:35:00Z"
        "400":
          description: "`reserva_id` não é um UUID válido"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401":
          description: Credencial ausente, malformada, expirada ou com assinatura inválida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "404":
          description: |
            Não há pagamento visível para essa reserva. Cobre dois casos
            deliberadamente indistinguíveis: a reserva não tem transação,
            ou a transação pertence a outra pessoa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503":
          description: Serviço incapaz de consultar o armazenamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    post:
      summary: Escolhe a forma de pagamento da reserva
      description: |
        Reservar uma poltrona e escolher como pagar são decisões distintas: a
        reserva cria a transação sabendo **quanto** cobrar, e é esta operação que
        diz **como**. Até ela acontecer, a transação fica em `AGUARDANDO_FORMA`.

        A resposta é `202`, não `200`: o pedido foi aceito e a cobrança acontece
        **fora desta requisição** — quem paga não espera o adquirente responder.
        O desfecho chega pelo `GET` desta mesma rota ou pela notificação.

        Só a pessoa dona da reserva escolhe; para qualquer outra a resposta é
        indistinguível de reserva inexistente.

        Se o prazo da reserva venceu antes da escolha, nada é cobrado: a
        transação é cancelada e a resposta é `409`. As poltronas já foram
        liberadas do outro lado, e cobrar por elas seria cobrar por assento que
        outra pessoa pode ter levado.
      operationId: escolherFormaDePagamento
      security:
        - clientCredentials: []
      parameters:
        - name: reserva_id
          in: path
          required: true
          description: UUID v4 da reserva
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscolhaDeForma" }
      responses:
        "202":
          description: |
            Escolha aceita; a transação passou a `PROCESSANDO` e a cobrança será
            feita fora desta requisição.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pagamento" }
        "400":
          description: "`reserva_id` não é um UUID, corpo inválido, ou forma de pagamento desconhecida"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401":
          description: Credencial ausente, malformada, expirada ou com assinatura inválida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "404":
          description: |
            Não há pagamento visível para essa reserva — não existe, ou pertence
            a outra pessoa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "409":
          description: |
            A forma já havia sido escolhida, ou o prazo da reserva venceu e ela
            foi cancelada. O `codigo` do corpo distingue os dois.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503":
          description: Serviço incapaz de gravar a escolha
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /health/live:
    get:
      summary: O processo está no ar
      security: []
      responses:
        "200": { description: Processo vivo }
  /health/ready:
    get:
      summary: O serviço é capaz de processar cobranças
      description: Verifica armazenamento e canal de eventos.
      security: []
      responses:
        "200": { description: Pronto }
        "503": { description: Alguma dependência indisponível }
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      description: |
        Fluxo máquina-a-máquina: a service account do client troca
        client_id/client_secret por um token, sem usuário humano no meio.
        Use `cinema-m2m` / `segredo-de-desenvolvimento`.

        O `tokenUrl` aponta para `localhost` porque quem o chama é o navegador,
        não o serviço. Use este fluxo pelo Swagger apenas em desenvolvimento: o
        secret trafega pelo navegador e o client deixa de ser confidencial.

        O token é validado de forma stateless por JWKS (assinatura, emissor,
        público e validade). Atenção: o `sub` de uma service account não é o de
        uma pessoa, e a consulta compara o `sub` ao dono da transação — por este
        fluxo a autenticação passa, mas a autorização nega transação de terceiro.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8081/realms/cinema/protocol/openid-connect/token
          scopes: {}
  schemas:
    EscolhaDeForma:
      type: object
      required: [forma_pagamento]
      properties:
        forma_pagamento: { type: string, enum: [PIX, CARTAO_CREDITO] }
      additionalProperties: false

    Pagamento:
      type: object
      required: [transacao_id, reserva_id, status, valor_total, expira_em, criado_em]
      properties:
        transacao_id:   { type: string, format: uuid }
        reserva_id:     { type: string, format: uuid }
        status:
          type: string
          enum: [AGUARDANDO_FORMA, PROCESSANDO, PAGO, RECUSADO, CANCELADO, PENDENTE_VERIFICACAO]
        valor_total:    { type: number, format: double, exclusiveMinimum: 0 }
        forma_pagamento:
          type: string
          enum: [PIX, CARTAO_CREDITO]
          description: |
            Ausente enquanto a escolha não acontece: o valor é conhecido desde a
            reserva, a forma não.
        expira_em:
          type: string
          format: date-time
          description: |
            Prazo da reserva. Depois dele não há mais o que pagar, e a escolha da
            forma responde 409.
        criado_em:      { type: string, format: date-time }
      description: |
        `motivo_falha` e `codigo_transacao_gateway` NÃO são expostos: o motivo da
        recusa já chega ao aplicativo pela notificação, e não expor referência de
        adquirente evita vazar detalhe da integração pela API pública.
    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:   { type: string, description: "categoria estável do erro" }
        mensagem: { type: string, description: "texto humano, livre para mudar de redação" }
