services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
      POSTGRES_DB: catalogo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica as migrações e sai. O catálogo só sobe depois que este passo termina
  # com sucesso, então o serviço nunca encontra um esquema pela metade.
  #
  # O `search_path=public` fixa onde vive a tabela de controle do migrate. Sem
  # ele o padrão `"$$user", public` a moveria de lugar assim que a primeira
  # migração criasse o schema `catalogo` (o usuário do banco tem o mesmo nome),
  # e a ferramenta perderia o rastro das versões já aplicadas.
  migrate:
    image: migrate/migrate:v4.17.1
    volumes: ["./migrations:/migrations:ro"]
    command:
      - -path=/migrations
      - -database=postgres://catalogo:catalogo@postgres:5432/catalogo?sslmode=disable&search_path=public
      - up
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8081"
      # O emissor precisa ser a MESMA URL dentro e fora da rede do compose: o
      # token carrega `iss`, e o catálogo recusa qualquer emissor diferente do
      # que descobriu no boot. Daí o hostname `keycloak` e a porta 8081 iguais
      # nos dois lados. O console de admin fica em localhost para o navegador.
      KC_HOSTNAME: http://keycloak:8081
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /realms/cinema HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | head -1 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 30

  estoque-simulado:
    build:
      context: .
      dockerfile: Dockerfile.estoque-simulado
    ports: ["50051:50051"]

  catalogo:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://catalogo:catalogo@postgres:5432/catalogo?sslmode=disable
      KEYCLOAK_ISSUER_URL: http://keycloak:8081/realms/cinema
      KEYCLOAK_AUDIENCE: cinema-app
      ESTOQUE_GRPC_ADDR: estoque-simulado:50051
      LOG_LEVEL: info
    ports: ["8082:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      estoque-simulado:
        condition: service_started
